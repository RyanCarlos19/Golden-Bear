name: Gerar APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Baixar fontes (Jost e Cormorant Garamond)
        run: |
          mkdir -p www/fonts
          curl -fL "https://raw.githubusercontent.com/google/fonts/main/ofl/jost/Jost%5Bwght%5D.ttf" -o www/fonts/Jost.ttf || echo "Nao foi possivel baixar a fonte Jost"
          curl -fL "https://raw.githubusercontent.com/google/fonts/main/ofl/cormorantgaramond/CormorantGaramond%5Bwght%5D.ttf" -o www/fonts/CormorantGaramond.ttf || echo "Nao foi possivel baixar a fonte Cormorant Garamond"
          ls -la www/fonts

      - name: Instalar dependencias
        run: npm install

      - name: Criar projeto Android
        run: npx cap add android

      - name: Gerar icone do urso
        continue-on-error: true
        run: npx capacitor-assets generate --android --iconBackgroundColor '#04201a' --iconBackgroundColorDark '#04201a'

      - name: Sincronizar app
        run: npx cap sync android

      - name: Compilar APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: urso-dourado-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
